<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign In - InventraFlow</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#875A7B", // Updated to match user request for ERP style
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
    <!-- Top Navigation Bar (Simplified for Auth Page) -->
    <header
        class="w-full flex items-center justify-between px-6 py-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
        <div class="flex items-center gap-2">
            <div class="text-primary">
                <span class="material-symbols-outlined text-3xl">inventory_2</span>
            </div>
            <h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold tracking-tight">InventraFlow</h2>
        </div>
        <div class="flex items-center gap-4">
            <button class="text-slate-600 dark:text-slate-400 text-sm font-medium hover:text-primary transition-colors">
                Help
            </button>
        </div>
    </header>
    <main class="flex-1 flex flex-col items-center justify-center p-6">
        <!-- Logo Section -->
        <div class="mb-8 flex flex-col items-center">
            <div
                class="w-24 h-24 mb-4 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-center overflow-hidden">
                <img src="{{ url_for('static', filename='odoo.jpeg') }}">
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Welcome Back</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-1">Warehouse Management System</p>
        </div>
        <!-- Sign-In Card -->
        <div
            class="w-full max-w-md bg-white dark:bg-slate-900 rounded-xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
            <form action="#" class="space-y-6" method="POST">
                <!-- Email Input -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2" for="email">
                        Email Address
                    </label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
                        <input
                            class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none placeholder:text-slate-400"
                            id="email" name="email" placeholder="admin@inventraflow.com" required="" type="email" />
                    </div>
                </div>
                <!-- Password Input -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" for="password">
                            Password
                        </label>
                        <a class="text-sm font-medium text-primary hover:underline" href="#">
                            Forgot Password?
                        </a>
                    </div>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                        <input
                            class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none placeholder:text-slate-400"
                            id="password" name="password" placeholder="••••••••" required="" type="password" />
                    </div>
                </div>
                <!-- Remember Me -->
                <div class="flex items-center">
                    <input class="h-4 w-4 text-primary focus:ring-primary border-slate-300 rounded cursor-pointer"
                        id="remember" name="remember" type="checkbox" />
                    <label class="ml-2 block text-sm text-slate-600 dark:text-slate-400 cursor-pointer" for="remember">
                        Remember this device
                    </label>
                </div>
                <!-- Sign In Button -->
                <button
                    class="w-full py-3 px-4 bg-primary hover:bg-opacity-90 text-white font-bold rounded-lg shadow-md transition-all flex items-center justify-center gap-2"
                    type="submit">
                    <span class="material-symbols-outlined text-xl">login</span>
                    Sign In
                </button>
            </form>
            <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
                <p class="text-sm text-slate-500 dark:text-slate-400">
                    Don't have an account? <a class="text-primary font-semibold hover:underline" href="#">Contact
                        Administrator</a>
                </p>
            </div>
        </div>
        <!-- Footer Info -->
        <footer class="mt-8 text-center text-slate-400 dark:text-slate-600 text-xs">
            <p>© 2024 InventraFlow. Powered by Odoo.</p>
            <div class="mt-2 space-x-4">
                <a class="hover:text-slate-600 transition-colors" href="#">Privacy Policy</a>
                <a class="hover:text-slate-600 transition-colors" href="#">Terms of Service</a>
            </div>
        </footer>
    </main>
    <!-- Visual Accent Element -->
    <div class="fixed bottom-0 right-0 p-8 pointer-events-none opacity-10 dark:opacity-5">
        <span class="material-symbols-outlined text-[200px] text-primary select-none">warehouse</span>
    </div>
</body>

</html>
