<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <script src="{{ url_for('static', filename='js/firebase.js') }}"></script>
    <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#875A7B", // Updated to requested Odoo-style primary color
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <title>Sign Up | InventraFlow</title>
</head>

<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col">
    <!-- Navigation / Top Bar -->
    <header class="w-full py-6 flex justify-center">
        <div class="flex flex-col items-center gap-2">
            <!-- Logo Placeholder simulating Odoo style -->
            <div class="flex items-center gap-2">
                <div class="bg-primary p-2 rounded-lg">
                    <span class="material-symbols-outlined text-white text-3xl">inventory_2</span>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">InventraFlow</h1>
            </div>
        </div>
    </header>
    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 pb-12">
        <div
            class="w-full max-w-[440px] bg-white dark:bg-slate-900 shadow-xl rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <!-- Header Image / Pattern Area -->
            <div class="h-2 w-full bg-primary"></div>
            <div class="p-8">
                <div class="mb-8 text-center">
                    <h2 class="text-2xl font-semibold text-slate-900 dark:text-slate-100">Create Account</h2>
                    <p class="text-slate-500 dark:text-slate-400 mt-2">Get started with your warehouse management</p>
                </div>
                <form action="#" class="space-y-5" method="POST">
                    <!-- Full Name -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"
                            for="full-name">Full Name</label>
                        <div class="relative">
                            <input
                                class="block w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm h-11"
                                id="full-name" name="full-name" placeholder="John Doe" required="" type="text" />
                        </div>
                    </div>
                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"
                            for="email">Email Address</label>
                        <div class="relative">
                            <input
                                class="block w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm h-11"
                                id="email" name="email" placeholder="name@company.com" required="" type="email" />
                        </div>
                    </div>
                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"
                            for="password">Password</label>
                        <div class="relative">
                            <input
                                class="block w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm h-11"
                                id="password" name="password" placeholder="••••••••" required="" type="password" />
                        </div>
                    </div>
                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"
                            for="confirm-password">Confirm Password</label>
                        <div class="relative">
                            <input
                                class="block w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm h-11"
                                id="confirm-password" name="confirm-password" placeholder="••••••••" required=""
                                type="password" />
                        </div>
                    </div>
                    <!-- Terms checkbox (ERP style often includes this) -->
                    <div class="flex items-center">
                        <input class="h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary" id="terms"
                            name="terms" required="" type="checkbox" />
                        <label class="ml-2 block text-sm text-slate-600 dark:text-slate-400" for="terms">
                            I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a>
                        </label>
                    </div>
                    <!-- Sign Up Button -->
                    <button type="button" onclick="signup()"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-primary hover:bg-opacity-90">
                        Sign Up
                    </button>
                </form>
                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="bg-white dark:bg-slate-900 px-2 text-slate-500">Already a user?</span>
                    </div>
                </div>
                <!-- Sign In Link -->
                <div class="text-center">
                    <a class="text-sm font-semibold text-primary hover:underline" href="/">
                        Sign In
                    </a>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer Decoration -->
    <footer class="py-8 px-4 text-center">
        <p class="text-xs text-slate-400 dark:text-slate-500 uppercase tracking-widest">
            Powered by InventraFlow ERP
        </p>
        <div class="mt-4 flex justify-center gap-6 opacity-40">
            <div class="h-32 w-32 rounded-full bg-primary/10 blur-3xl absolute -bottom-10 -left-10"></div>
            <div class="h-32 w-32 rounded-full bg-primary/10 blur-3xl absolute -top-10 -right-10"></div>
        </div>
    </footer>
    <!-- Background visual element -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-5">
        <div class="grid grid-cols-6 h-full w-full">
            <div class="border-r border-primary/20"></div>
            <div class="border-r border-primary/20"></div>
            <div class="border-r border-primary/20"></div>
            <div class="border-r border-primary/20"></div>
            <div class="border-r border-primary/20"></div>
            <div></div>
        </div>
    </div>
</body>

</html>
